name: "BidMe"
description: "Run BidMe automation inside a GitHub repository"

inputs:
  command:
    description: "BidMe runtime command: open-bidding, process-bid, close-bidding, update-analytics"
    required: true
  issue:
    description: "GitHub issue number for process-bid"
    required: false
  comment:
    description: "GitHub issue comment id for process-bid"
    required: false
  target:
    description: "Repository checkout path"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@v2

    - name: Install BidMe action dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: ${{ github.action_path }}

    - name: Run BidMe
      shell: bash
      run: |
        set -euo pipefail
        INPUT_COMMAND="${{ inputs.command }}" \
        INPUT_ISSUE="${{ inputs.issue }}" \
        INPUT_COMMENT="${{ inputs.comment }}" \
        INPUT_TARGET="${{ inputs.target }}" \
        bun run "${GITHUB_ACTION_PATH}/src/action.ts"
